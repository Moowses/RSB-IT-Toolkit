name: test
on: [push, pull_request]
jobs:
  pester-and-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modules = @('Pester','PSScriptAnalyzer')
          foreach ($module in $modules) {
            $installed = $false
            foreach ($attempt in 1..3) {
              try {
                if ($module -eq 'Pester') { Install-Module Pester -RequiredVersion 5.7.1 -Force -AllowClobber -SkipPublisherCheck -Scope CurrentUser }
                else { Install-Module PSScriptAnalyzer -Force -AllowClobber -SkipPublisherCheck -Scope CurrentUser }
                $installed = $true
                break
              } catch {
                if ($attempt -eq 3) { throw }
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
            if (-not $installed) { throw "Unable to install $module." }
          }
      - name: Run Pester
        shell: pwsh
        run: Invoke-Pester ./tests -CI
      - name: Analyze scripts
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
