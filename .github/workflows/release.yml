name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tooling
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0; Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Validate release source
        shell: pwsh
        run: Invoke-Pester ./tests -CI; Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
      - name: Package verified release asset
        shell: pwsh
        run: ./Compile.ps1
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $arguments = @('release','create',$tag,'dist/RSB-IT-Toolkit.zip','dist/SHA256SUMS.txt','--title',$tag,'--generate-notes')
          if ($tag -match '-preview\.') { $arguments += '--prerelease' } else { $arguments += '--draft' }
          & gh @arguments
