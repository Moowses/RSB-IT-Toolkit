name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modules = @('Pester','PSScriptAnalyzer')
          foreach ($module in $modules) {
            $installed = $false
            foreach ($attempt in 1..3) {
              try {
                if ($module -eq 'Pester') { Install-Module Pester -RequiredVersion 5.7.1 -Force -AllowClobber -SkipPublisherCheck -Scope CurrentUser }
                else { Install-Module PSScriptAnalyzer -Force -AllowClobber -SkipPublisherCheck -Scope CurrentUser }
                $installed = $true
                break
              } catch {
                if ($attempt -eq 3) { throw }
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
            if (-not $installed) { throw "Unable to install $module." }
          }
      - name: Validate release source
        shell: pwsh
        run: Invoke-Pester ./tests -CI; Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
      - name: Package verified release asset
        shell: pwsh
        run: ./Compile.ps1
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $arguments = @('release','create',$tag,'dist/RSB-IT-Toolkit.zip','dist/SHA256SUMS.txt','--title',$tag,'--generate-notes')
          if ($tag -match '-preview\.') { $arguments += '--prerelease' } else { $arguments += '--draft' }
          & gh @arguments
