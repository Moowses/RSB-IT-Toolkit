name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package verified release asset
        shell: pwsh
        run: ./Compile.ps1
      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/RSB-IT-Toolkit.zip
            dist/SHA256SUMS.txt
